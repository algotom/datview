name: Publish to Conda

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish_conda:
    name: Build and Upload to Conda
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v2
        with:
          auto-update-conda: true
          python-version: "3.11"
          channels: conda-forge,defaults

      - name: Install Conda Build Tools
        run: |
          conda install -y conda-build anaconda-client conda-verify
          conda config --add channels conda-forge

      - name: Build Conda Package
        run: conda build -c conda-forge recipe/

      - name: Upload to Anaconda Cloud
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
        run: anaconda upload --user algotom /home/runner/miniconda3/conda-bld/**/datview-*.tar.bz2
